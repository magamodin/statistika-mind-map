<h1>Statistika: izahlı və nümunəli</h1>
<p class="i" style="margin-top:-2px">Hazırladı: <b>Məmmədov Məhəmməd</b></p>
<p class="i">Mind map-də anlayışa toxunun: aşağıda onun düsturu, izahı, addım-addım düşüncə yolu və nümunəsi açılacaq. Xəritəni sürüşdürə və yaxınlaşdıra bilərsiniz.</p><div class="bar"><button id="zi">+</button><button id="zo">−</button><button id="zf">Sığdır</button><button id="dm">Demo</button></div><div id="sc"><svg id="m" role="img" aria-label="Statistika mind map"></svg></div>

<script>
const T=[
{c:'#8b6cf0',t:'1. İlkin anlayışlar və data tipləri',l:[
['Populyasiya və nümunə','N ↔ n','Populyasiya araşdırdığımız bütün obyektlərdir, nümunə isə ondan seçilmiş kiçik hissədir. Hamını ölçmək çətin olduğu üçün nümunəni öyrənib nəticəni populyasiyaya aid edirik.','Bakıda bütün tələbələrin orta balını bilmək istəyirik (populyasiya). 200 tələbəni sorğulayırıq (nümunə).'],
['Kəmiyyət və keyfiyyət','ölçülür ↔ kateqoriyadır','Kəmiyyət datası ədədlə ölçülür, ondan orta və s. hesablamaq olar. Keyfiyyət datası kateqoriyadır, onu yalnız saymaq olar.','Boy və maaş kəmiyyətdir. Göz rəngi və şəhər keyfiyyətdir (“orta göz rəngi” olmur).'],
['Diskret və kəsilməz','sayılır ↔ ölçülür','Diskret data ayrı-ayrı qiymətlər alır (0, 1, 2...). Kəsilməz data aralıqda istənilən qiyməti ala bilər. Bu, paylanma seçimini təyin edir.','Sinifdəki şagird sayı (28) diskretdir. Çəki (63.7 kq) kəsilməzdir.'],
['Şkalalar','nominal → ordinal → interval → ratio','Şkala yuxarı getdikcə daha çox əməliyyat mümkün olur. Nominal: yalnız ad. Ordinal: sıra var, fərq ölçülmür. Interval: fərq mənalıdır, real sıfır yoxdur. Ratio: real sıfır var, nisbət mənalıdır.','Qan qrupu nominal; razılıq (aşağı/orta/yüksək) ordinal; temperatur °C interval; çəki ratio. 40°C 20°C-dən “2 dəfə isti” deyil, amma 40 kq 20 kq-dan 2 dəfə ağırdır.'],
['Tezlik cədvəli','nisbi tezlik = fᵢ / n','Hər qiymətin neçə dəfə rast gəldiyini (tezlik) və ümumi içində payını (nisbi tezlik) göstərir. Nisbi tezliklərin cəmi həmişə 1 olur.','20 tələbədən 5-i “5” alıb: fᵢ = 5, nisbi tezlik = 5/20 = 0.25 (25%).','COUNTIF']]},
{c:'#4f8bff',t:'2. Mərkəzilik və dəyişiklik',l:[
['Orta','x̄ = Σxᵢ / n','Bütün qiymətlərin cəmini sayına bölürük. Ümumi səviyyəni göstərir, amma kənar qiymətə çox həssasdır.','4, 6, 8, 10, 12 → 40/5 = 8. Amma 4, 6, 8, 10, 100 → orta 25.6 olur və data üçün tipik deyil.','AVERAGE'],
['Median','median = (n+1)/2-ci qiymət','Qiymətləri sıralayıb ortadakını götürürük. Outlier-dən təsirlənmir. Cüt saydadırsa iki ortanın ortasıdır.','3, 5, 7, 9, 100 → median 7 (orta 24.8 olardı). 2, 4, 6, 8 → median (4+6)/2 = 5.','MEDIAN'],
['Moda','ən çox təkrarlanan qiymət','Ən tipik qiyməti və ya kateqoriyanı tapır. Keyfiyyət datasında da işləyir.','2, 3, 3, 3, 5, 7 → moda 3. Ən çox satılan ayaqqabı ölçüsü də moda ilə tapılır.','MODE.SNGL'],
['Kvartillər və IQR','IQR = Q3 − Q1','Q1 datanın 25%-i, Q3 isə 75%-i altındakı qiymətdir. IQR ortadakı 50% datanın yayılmasını göstərir.','1, 2, 3, 4, 5, 6, 7, 8 → Q1 = 2.75, Q3 = 6.25, IQR = 3.5.','QUARTILE.INC'],
['Outlier','x < Q1 − 1.5·IQR və ya x > Q3 + 1.5·IQR','Kənar, şübhəli qiymətləri tapır (boxplot-da nöqtə kimi görünür).','Yuxarıdakı data üçün sərhədlər: 2.75 − 5.25 = −2.5 və 6.25 + 5.25 = 11.5. Qiymət 20 olsaydı, outlier sayılardı.'],
['Aralıq','R = max − min','Ən sadə yayılma ölçüsüdür, amma yalnız iki ifrat qiymətdən asılıdır.','4, 6, 8, 10, 12 → R = 12 − 4 = 8.','MAX, MIN'],
['Variansı','s² = Σ(xᵢ − x̄)² / (n − 1)','Qiymətlərin ortadan orta kvadrat uzaqlığıdır. Nümunə üçün n−1-ə bölünür.','2, 4, 6: x̄ = 4, kənarlaşmalar −2, 0, 2, kvadratlar 4, 0, 4, cəm 8 → s² = 8/2 = 4.','VAR.S'],
['Standart sapma','s = √s²','Varians kvadrat vahiddədir, kökü isə datanın öz vahidindədir. Qiymətlərin ortadan orta uzaqlığı kimi oxunur.','Yuxarıda s = √4 = 2: qiymətlər ortadan təxminən 2 vahid uzaqdır.','STDEV.S'],
['Variasiya əmsalı','CV = (s / x̄) · 100%','Fərqli miqyaslı dataları müqayisə etməyə imkan verir, çünki yayılmanı ortaya nisbətdə verir.','Avtomobil: orta 1500 kq, s = 50 → CV 3.3%. Alma: orta 150 q, s = 20 → CV 13.3%. Almanın çəkisi nisbən daha çox dəyişir.']]},
{c:'#19c2b0',t:'3. Ehtimal nəzəriyyəsinin əsasları',l:[
['Hadisə məkanı və P(A)','P(A) = m / n','Əlverişli halların sayını bütün mümkün halların sayına bölürük (halların eyni ehtimallı olduğu halda).','Zər atanda cüt gəlmə: əlverişli 2, 4, 6 → P = 3/6 = 0.5.','COUNTIFS'],
['Tamamlayıcı hadisə','P(Aᶜ) = 1 − P(A)','“Ən azı biri” tipli məsələlərdə “heç biri” ehtimalını tapıb 1-dən çıxmaq daha asandır.','3 sikkədə ən azı bir gerb: heç gerb olmaması (1/2)³ = 1/8 → cavab 1 − 1/8 = 7/8.'],
['Qarşılıqlı istisna','P(A∩B) = 0 → P(A∪B) = P(A) + P(B)','Hadisələr eyni anda baş verə bilmir, ona görə ehtimallar sadəcə toplanır.','Zərdə 1 və ya 2 gəlməsi: 1/6 + 1/6 = 1/3.'],
['Ümumi cəm qaydası','P(A∪B) = P(A) + P(B) − P(A∩B)','“A və ya B” ehtimalıdır. Kəsişmə iki dəfə sayıldığı üçün bir dəfə çıxılır.','Zərdə A = cüt {2,4,6}, B = 3-dən böyük {4,5,6}. Kəsişmə {4,6}. P = 3/6 + 3/6 − 2/6 = 4/6 = 2/3.'],
['Müstəqil hadisələr','P(A∩B) = P(A) · P(B)','Biri baş verəndə digərinin ehtimalı dəyişmir. Onda “və” ehtimalı vurmaqla tapılır.','İki sikkənin ikisində də gerb: 1/2 · 1/2 = 1/4.'],
['Şərti ehtimal','P(A|B) = P(A∩B) / P(B)','B-nin baş verdiyi məlum olduqda A-nın ehtimalıdır. Mümkün halların dairəsi B-yə qədər daralır.','Zər cüt gəlib (B). Bu, 6 olma (A) ehtimalı: (1/6)/(3/6) = 1/3.'],
['Bayes qaydası','P(A|B) = P(B|A) · P(A) / P(B)','Şərti ehtimalı tərsinə çevirir: nəticəni bilib səbəbin ehtimalını tapırıq.','Xəstəlik 1%-dir. Test xəstədə 95% müsbət, sağlamda 5% yanlış müsbət verir. P(müsbət) = 0.95·0.01 + 0.05·0.99 = 0.059. Testi müsbət olanın xəstə olma ehtimalı 0.0095/0.059 ≈ 16%. Yəni müsbət test həmişə xəstəlik demək deyil.']]},
{c:'#5ccf3f',t:'4. Təsadüfi dəyişənlər və paylanmalar',l:[
['Ehtimal kütləsi və yığılma','F(x) = P(X ≤ x) = Σ P(xᵢ)','PMF tək bir qiymətin ehtimalını, CDF isə “ən çox x” ehtimalını verir.','Zər: P(X=3) = 1/6, F(3) = P(X ≤ 3) = 3/6 = 0.5.'],
['Gözlənilən dəyər','E(X) = Σ x · P(x)','Təcrübəni çox dəfə təkrarlasaq, nəticənin uzunmüddətli orta qiyməti.','Zər: (1+2+3+4+5+6)/6 = 3.5. Heç bir atışda 3.5 gəlmir, amma ortalama belə olur.'],
['Variansı','Var(X) = E(X²) − [E(X)]²','Nəticələrin gözlənilən dəyər ətrafında yayılmasıdır.','Zər: E(X²) = 91/6 ≈ 15.17, [E(X)]² = 12.25 → Var = 35/12 ≈ 2.92.'],
['Dörd moment','orta · varians · əyrilik · ekssess','Orta mərkəzi, varians yayılmanı, əyrilik asimmetriyanı, ekssess isə quyruqların ağırlığını göstərir.','Maaşlar sağa əyridir: az sayda çox yüksək maaş orta və quyruğu uzadır.','SKEW, KURT'],
['Binomial','P(X=k) = C(n,k) · pᵏ · (1−p)ⁿ⁻ᵏ','n müstəqil sınaqda tam k uğur ehtimalıdır. Hər sınaqda uğur ehtimalı p-dir.','10 sikkədə tam 3 gerb: C(10,3) = 120, 120 · 0.5¹⁰ = 120/1024 ≈ 0.117.','BINOM.DIST(3;10;0.5;FALSE)'],
['Poisson','P(X=k) = λᵏ · e⁻λ / k!','Vahid zaman və ya məkanda hadisə sayını modelləşdirir. λ orta saydır.','Zəng mərkəzinə saatda orta 4 zəng gəlir. Tam 2 zəng: 4² · e⁻⁴ / 2! = 16 · 0.0183 / 2 ≈ 0.147.','POISSON.DIST(2;4;FALSE)'],
['Uniform','f(x) = 1 / (b − a)','[a, b] aralığında bütün qiymətlər eyni ehtimallıdır.','Avtobus hər 10 dəqiqədən gəlir, gəldiyin an təsadüfidir. 3 dəqiqədən az gözləmə ehtimalı 3/10 = 0.3.'],
['Normal','Z = (X − μ) / σ','Zəng əyrisidir. Z qiyməti nəticənin ortadan neçə standart sapma uzaq olduğunu göstərir və istənilən normal paylanmanı standart formaya gətirir.','İmtahan: μ = 70, σ = 10. Bal 85 üçün Z = 1.5, yəni tələbələrin təxminən 93%-i 85-dən aşağı bal alıb.','NORM.DIST(85;70;10;TRUE)']]},
{c:'#f5a524',t:'5. Çoxdəyişənli dəyişənlər və korrelyasiya',l:[
['Birgə paylanma','P(X=x, Y=y)','İki dəyişənin eyni anda müəyyən qiymətlər alması ehtimalı cədvəlidir. Növbəti nümunələrdə bu cədvəldən istifadə olunur: P(0,0)=0.3, P(0,1)=0.2, P(1,0)=0.1, P(1,1)=0.4.','P(X=1, Y=1) = 0.4. Cədvəlin bütün xanalarının cəmi 1-dir.'],
['Marjinal paylanma','P(X=x) = Σ P(x, y)','Cədvəlin sətir və ya sütun cəmidir. Digər dəyişəni “unudub” yalnız birinə baxırıq.','P(X=0) = 0.3 + 0.2 = 0.5. P(Y=1) = 0.2 + 0.4 = 0.6.'],
['Kovarians','Cov(X,Y) = Σ(xᵢ−x̄)(yᵢ−ȳ) / (n−1)','Əlaqənin istiqamətini göstərir: + olsa eyni yönlü, − olsa əks yönlü dəyişirlər. Miqyasdan asılıdır.','x = oxuma saatı: 1, 2, 3. y = bal: 50, 60, 70. x̄ = 2, ȳ = 60. Hasillər: 10, 0, 10 → Cov = 20/2 = 10 (müsbət).','COVARIANCE.S'],
['Korrelyasiya','r = Cov(X,Y) / (sₓ · s_y)','Kovariansı standartlaşdırır: əlaqənin gücü −1 ilə +1 arasında olur. 0-a yaxın olduqda xətti əlaqə zəifdir.','Yuxarıda sₓ = 1, s_y = 10 → r = 10/10 = 1 (mükəmməl müsbət əlaqə). Diqqət: korrelyasiya səbəbiyyət demək deyil. Dondurma satışı ilə suda boğulma da yayda birgə artır.','CORREL'],
['Şərti paylanma','P(Y=y|X=x) = P(x, y) / P(x)','X-in qiyməti məlum olanda Y-nin yeni paylanmasıdır.','P(Y=1|X=0) = 0.2 / 0.5 = 0.4. P(Y=0|X=0) = 0.3 / 0.5 = 0.6.'],
['Şərti gözlənti','E(Y|X=x) = Σ y · P(y|x)','X-ə görə Y-nin gözlənilən orta qiymətidir. Reqressiyanın əsas ideyasıdır.','E(Y|X=0) = 0 · 0.6 + 1 · 0.4 = 0.4.']]},
{c:'#f0527a',t:'6. Xətti reqressiya və diaqnostika',l:[
['Model','ŷ = β₀ + β₁x','x-dən y-i proqnozlaşdıran düz xətt. ŷ proqnoz, yəni y-in təxmini qiymətidir.','Oxuma saatı (x) və bal (y) üçün ŷ = 40 + 10x. 4 saat oxuyan tələbəyə proqnoz: 40 + 40 = 80 bal.'],
['Meyl','β₁ = Cov(x,y) / Var(x)','x 1 vahid artanda y-nin orta hesabla nə qədər dəyişdiyini göstərir.','5-ci dərsdəki data: Cov = 10, Var(x) = 1 → β₁ = 10. Hər əlavə saat orta hesabla +10 bal.','SLOPE'],
['Kəsik','β₀ = ȳ − β₁ · x̄','x = 0 olduqda proqnozdur. Xətt həmişə (x̄, ȳ) nöqtəsindən keçir.','β₀ = 60 − 10 · 2 = 40. Heç oxumayan tələbəyə proqnoz 40 baldır.','INTERCEPT'],
['Qalıq','eᵢ = yᵢ − ŷᵢ','Real qiymətlə proqnozun fərqi, yəni modelin səhvidir. Diaqnostikanın əsasıdır.','Tələbə 3 saat oxuyub, real bal 75, proqnoz 70 → e = 75 − 70 = +5. Model bu tələbəni 5 bal az qiymətləndirib.'],
['Determinasiya','R² = 1 − SSE / SST','Y-nin dəyişkənliyinin neçə faizinin modellə izah olunduğunu göstərir (0-dan 1-ə qədər). SSE qalıqların kvadratlar cəmi, SST ümumi dəyişkənlikdir.','R² = 0.64 olarsa, ballardakı fərqlərin 64%-i oxuma saatı ilə izah olunur, qalan 36% başqa amillərdəndir.','RSQ'],
['Diaqnostika','xəttilik · normallıq · sabit varians','Qalıq qrafiki ilə modelin şərtləri yoxlanır. Düzgün modeldə qalıqlar 0 ətrafında təsadüfi səpələnir.','Qalıqlar əyri (U) forma alırsa, xəttilik pozulub. Nöqtələr sağa getdikcə qıfıl kimi genişlənirsə, varians sabit deyil.']]},
{c:'#e05bd1',t:'7. Seçmə paylanması və etibar intervalı',l:[
['Mərkəzi limit teoremi','x̄ ~ N(μ, σ/√n)','Populyasiya necə paylanmış olsun, nümunələrin ortalarını çoxlu dəfə hesablasaq, n kifayət qədər böyük olduqda (təxminən n ≥ 30) bu ortalar zəng əyrisinə yaxınlaşır. Məhz buna görə normal olmayan data üçün də Z və t testlərini işlədə bilirik.','Zər sərbəst paylanmışdır (normal deyil). 30 zər atıb ortasını yazırıq, bunu 1000 dəfə təkrarlayırıq: ortalar 3.5 ətrafında zəng əyrisi əmələ gətirir.',null,'1) Nümunə seç, x̄ hesabla. 2) Bunu çox təkrarla. 3) Alınan x̄-ların histoqramına bax: mərkəzi μ-dədir, eni σ/√n-dir.'],
['Standart xəta','SE = s / √n','Nümunə ortasının populyasiya ortasından orta hesabla nə qədər sapa biləcəyini göstərir. Standart sapma datanın yayılmasıdır, standart xəta isə ortanın dəqiqliyidir. n artdıqca SE azalır.','s = 10, n = 25 → SE = 10/5 = 2. n = 100 olsa SE = 10/10 = 1. Dəqiqliyi 2 dəfə artırmaq üçün nümunəni 4 dəfə böyütmək lazımdır.','STDEV.S(A:A)/SQRT(COUNT(A:A))','1) s-i tap. 2) n-in kvadrat kökünü tap. 3) s-i ona böl.'],
['Etibar intervalı','x̄ ± t* · SE','Populyasiya ortasının yerləşə biləcəyi aralıqdır. 95% intervalı belə oxunur: eyni qaydada çoxlu nümunə götürsək, intervalların təxminən 95-i həqiqi μ-ni tutacaq. Yəni tək ədəd əvəzinə “ən çox bu aralıqda” deyirik.','25 tələbə: x̄ = 70, s = 10, SE = 2. df = 24 üçün t* = 2.064. Yanlışlıq payı = 2.064 · 2 = 4.13 → interval (65.87; 74.13).','CONFIDENCE.T(0.05;10;25)','1) SE-ni tap. 2) t* tap (T.INV.2T(0.05;n−1)). 3) x̄-dan həm çıx, həm əlavə et. İnterval nə qədər dardırsa, qiymətləndirmə bir o qədər dəqiqdir.']]},
{c:'#ff7a45',t:'8. Hipotez testləri',l:[
['H₀ və H₁','H₀: μ = μ₀   |   H₁: μ ≠ μ₀','Hipotez testi bir iddianı nümunə ilə yoxlayır. H₀ (sıfır hipotez) “heç nə dəyişməyib, fərq yoxdur” iddiasıdır. H₁ (alternativ) isə sübut etmək istədiyimiz yenilikdir. Məhkəmə kimi: H₀ = təqsirsizdir; sübut kifayət deyilsə, onu rədd etmirik (təqsirsizliyi “sübut” etmirik).','Məktəb deyir orta bal 70-dir. Biz bunun fərqli olduğunu düşünürük → H₀: μ = 70, H₁: μ ≠ 70.',null,'Sual belə qoyulur: “Nümunədə gördüyüm fərq sadəcə təsadüf ola bilərmi?” H₀ “bəli, təsadüfdür” deyir.'],
['Testin addımları','H₀,H₁ → α → statistika → p → qərar','Hər hipotez testi eyni 5 addımdan keçir. Testin növü (z, t, χ², F) yalnız 3-cü addımda dəyişir.','25 tələbə, x̄ = 73, s = 10. 1) H₀: μ = 70. 2) α = 0.05. 3) t = (73−70)/(10/5) = 1.5. 4) df = 24, p ≈ 0.147. 5) p > α → H₀ rədd edilmir: fərq təsadüf ola bilər.',null,'1) Hipotezləri yaz. 2) α seç. 3) Test statistikasını hesabla. 4) p-value tap (və ya kritik qiymətlə müqayisə et). 5) Qərar ver və cavabı sözlə yaz.'],
['α və p-value','p < α → H₀ rədd','α yanlış rədd riskinə razılaşdığımız həddir (adətən 0.05). p-value isə H₀ doğru olsaydı, bizimki kimi və ya daha kəskin nəticənin alınma ehtimalıdır. p kiçikdirsə, nəticə təsadüfə oxşamır.','p = 0.03 < 0.05 → H₀ rədd edilir (nəticə statistik əhəmiyyətlidir). p = 0.147 > 0.05 → rədd edilmir. Diqqət: p “H₀-ın doğru olma ehtimalı” deyil və fərqin böyüklüyünü göstərmir.','T.DIST.2T(1.5;24)','p-nin kiçik olması fərqin praktiki olaraq vacib olması demək deyil: çox böyük nümunədə kiçik fərq də “əhəmiyyətli” çıxa bilər. Həmişə fərqin özünə də bax.'],
['Bir və ikitərəfli test','H₁: ≠ (iki)  |  > (sağ)  |  < (sol)','İkitərəfli testdə fərqin istiqaməti maraqlı deyil, α iki quyruğa bölünür (hər birində α/2). Birtərəfli testdə yalnız artım və ya azalma maraqlıdır, bütün α bir quyruqdadır. İstiqamət nümunəni görməmişdən əvvəl seçilməlidir.','Yeni dərs üsulu balı “dəyişir” (ikitərəfli) və ya “artırır” (sağ). α = 0.05 üçün z kritik qiymətləri: ±1.96 (iki), +1.645 (sağ).','NORM.S.INV(0.975)','Şübhə edirsənsə, ikitərəfli seç: o daha ehtiyatlıdır.'],
['I və II tip xəta','α = P(I tip), β = P(II tip), güc = 1 − β','I tip xəta: H₀ doğrudur, amma biz onu rədd edirik (yalançı həyəcan). II tip xəta: H₀ səhvdir, amma biz fərqi görmürük (qaçırma). Test gücü real fərq olanda onu tapma ehtimalıdır. α azaldıqca β artır; n artdıqca güc artır.','Xəstəlik testi: sağlama “xəstəsən” demək I tip, xəstəyə “sağlamsan” demək II tip xətadır. Tipik hədəf: α = 0.05, güc ≥ 0.80.',null,'Hansı xəta daha bahalıdır? Dərman təhlükəsizliyində I tip, ciddi xəstəliyin skrininqində II tip daha təhlükəlidir.'],
['Z-test','z = (x̄ − μ₀) / (σ / √n)','σ məlum olanda (və ya n çox böyük olanda) işlədilir. z fərqin neçə standart xəta olduğunu göstərir. |z| nə qədər böyükdürsə, fərq bir o qədər təsadüfi deyil. α = 0.05 ikitərəfli üçün |z| > 1.96 olarsa H₀ rədd edilir.','Zavod iddia edir: paketin orta çəkisi 500 q, σ = 12. 36 paketdə x̄ = 504. z = (504 − 500)/(12/6) = 2.0. İkitərəfli p ≈ 0.0455 < 0.05 → H₀ rədd: orta çəki 500-dən fərqlidir.','2*(1-NORM.S.DIST(2;TRUE))','1) SE = 12/6 = 2. 2) Fərq = 504 − 500 = 4. 3) z = 4/2 = 2.0. 4) |2.0| > 1.96 → rədd.'],
['Bir nümunəli t-test','t = (x̄ − μ₀) / (s / √n),  df = n − 1','σ adətən məlum olmur, ona görə onu s ilə əvəz edirik. Bu əlavə qeyri-müəyyənlik gətirir, buna görə normal əyri yox, quyruqları qalın t-paylanması işlədilir. n böyüdükcə t paylanması normala yaxınlaşır.','25 tələbə, x̄ = 73, s = 10, μ₀ = 70. t = 3/2 = 1.5. df = 24 üçün kritik ±2.064. |1.5| < 2.064 və p ≈ 0.147 → H₀ rədd edilmir.','T.DIST.2T(ABS(t);n-1)','Eyni sxem z-testdəki kimidir: fərq ÷ standart xəta. Yalnız s və df istifadə olunur.'],
['İki nümunəli t-test','t = (x̄₁ − x̄₂) / √(s₁²/n₁ + s₂²/n₂)','İki müstəqil qrupun ortalarını müqayisə edir: ortalar arasındakı fərq təsadüf həddindən böyükdürmü? H₀: μ₁ = μ₂. Fərq iki qrupun birgə standart xətasına bölünür.','A qrupu: n = 30, x̄ = 75, s = 10. B qrupu: n = 30, x̄ = 70, s = 10. SE = √(100/30 + 100/30) = 2.58; t = 5/2.58 ≈ 1.94; df ≈ 58; p ≈ 0.058 > 0.05 → H₀ rədd edilmir (fərq sərhəddədir).','T.TEST(A;B;2;3)','Qruplar bir-birindən asılı olmamalıdır (fərqli insanlar). Eyni insanlar iki dəfə ölçülübsə, növbəti testi işlət.'],
['Cütlənmiş t-test','t = d̄ / (s_d / √n)','Eyni obyektlər iki dəfə ölçüləndə (əvvəl/sonra) hər cütün fərqi d alınır və bu fərqlər üçün bir nümunəli t-test aparılır (H₀: orta fərq = 0). Cütləmə şəxslər arası fərqləri aradan qaldırdığı üçün daha həssasdır.','5 tələbənin kursdan əvvəl-sonra bal fərqləri: 4, 6, 2, 5, 3. d̄ = 4, s_d = 1.58, SE = 1.58/√5 = 0.71, t = 4/0.71 ≈ 5.66, df = 4, kritik 2.776 → H₀ rədd: kurs balı dəyişdirib.','T.TEST(əvvəl;sonra;2;1)','1) Hər cüt üçün d = sonra − əvvəl. 2) d-lərin ortasını və s_d-ni tap. 3) d̄-ı SE-yə böl. 4) df = n − 1.'],
['Xi-kvadrat testi','χ² = Σ (O − E)² / E','İki keyfiyyət dəyişəni arasında əlaqə varmı? Real saylar (O) ilə “əlaqə yoxdur” halında gözlənən saylar (E) fərqlənirsə, χ² böyük olur. H₀: dəyişənlər müstəqildir. E = sətir cəmi · sütun cəmi / ümumi say.','100 nəfər. Kişi: 30 hə / 20 yox. Qadın: 20 hə / 30 yox. Hər xanada E = 50·50/100 = 25. χ² = 4 · (5²/25) = 4.0, df = (2−1)(2−1) = 1, kritik 3.84 → H₀ rədd (p ≈ 0.046): cins və cavab asılıdır.','CHISQ.TEST(real;gözlənən)','1) E-ləri tap. 2) Hər xana üçün (O−E)²/E hesabla. 3) Topla. Şərt: hər xanada E ≥ 5.'],
['ANOVA (F-test)','F = qruplararası / qrupdaxili dəyişkənlik','3 və daha çox qrupun ortalarını bir anda müqayisə edir (cüt-cüt çoxlu t-test I tip xətanı şişirdir). F böyükdürsə, ən azı bir qrup ortası fərqlidir. Hansı qrupun fərqli olduğunu sonradan post-hoc test (məs., Tukey) göstərir.','3 qrup: A: 4, 5, 6 (orta 5). B: 6, 7, 8 (orta 7). C: 8, 9, 10 (orta 9). Ümumi orta 7. Qruplararası: 24/2 = 12. Qrupdaxili: 6/6 = 1. F = 12/1 = 12; kritik F(2;6) = 5.14 → H₀ rədd (p ≈ 0.008).','F.DIST.RT(12;2;6)','Düşün: qrupların ortaları arasındakı fərq (siqnal) qrupların daxili səpələnməsindən (səs-küy) nə qədər böyükdür? F = siqnal / səs-küy.']]}
];
const tx=(x,y,s,a='middle',c='st')=>`<text x="${x}" y="${y}" text-anchor="${a}" class="${c}">${s}</text>`;
const rc=(x,y,w,h,c='sl',r=3)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${c}"/>`;
const ci=(x,y,r,c='sf')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
const ln=(x1,y1,x2,y2,c='sx')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const pa=(d,c='sa')=>`<path d="${d}" class="${c}"/>`;
const tri=(x,y)=>pa(`M${x} ${y}l-6 10h12z`,'sf');
const bars=(v,lb,hi=[],fmt=a=>a,o={})=>{const{x0=20,x1=280,by=96,h=68,mx=Math.max(...v)}=o,w=(x1-x0)/v.length;return ln(x0,by,x1,by)+v.map((a,i)=>{const bh=a/mx*h,x=x0+i*w+w*.15,c=x+w*.35;return rc(x,by-bh,w*.7,bh,hi.includes(i)?'sh':'sl')+tx(c,by+11,lb[i],'middle','sm')+tx(c,by-bh-3,fmt(a,i),'middle','st')}).join('')};
const cv=(f,x0,w,by,h,a,b,c='sa',fill=false,lo=a,hi=b)=>{let d='';const n=120;for(let t=0;t<=n;t++){const xv=lo+(hi-lo)*t/n,X=x0+(xv-a)/(b-a)*w,Y=by-f(xv)*h;d+=(t?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1)}if(fill)d+=`L${x0+(hi-a)/(b-a)*w} ${by}L${x0+(lo-a)/(b-a)*w} ${by}Z`;return pa(d,c)};
const D=[1,2,3,4,5,6];
const nrm=x=>Math.exp(-x*x/2);
const box=(sx,y,mn,q1,md,q3,mx)=>ln(sx(mn),y,sx(mx),y)+ln(sx(mn),y-6,sx(mn),y+6)+ln(sx(mx),y-6,sx(mx),y+6)+rc(sx(q1),y-13,sx(q3)-sx(q1),26,'sl')+ln(sx(md),y-13,sx(md),y+13,'sa');
const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};
const fa=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const nz=i=>((i*37+11)%17)/17-.5;
const dice=(st)=>[1,2,3,4,5,6].map(k=>{const x=28+(k-1)*44,c=st(k);return rc(x,38,38,38,c)+tx(x+19,63,k,'middle',c=='sgl'?'sm':'st')}).join('');
const sx5=x=>40+x/5*240,sy5=y=>100-(y-30)/60*90;
const base5=()=>ln(40,100,280,100)+ln(40,10,40,100)+[0,1,2,3,4,5].map(v=>tx(sx5(v),111,v,'middle','sm')).join('')+[40,60,80].map(v=>tx(36,sy5(v)+3,v,'end','sm')).join('')+pa(`M${sx5(0)} ${sy5(40)}L${sx5(5)} ${sy5(90)}`)+tx(282,111,'saat','end','sm')+tx(44,14,'bal','start','sm');
const dots5=()=>[[1,50],[2,60],[3,70]].map(p=>ci(sx5(p[0]),sy5(p[1]),4)).join('');
const hm=(x,y,w,h,v,t)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="sf" style="fill-opacity:${(.12+v*1.4).toFixed(2)}"/>`+tx(x+w/2,y+h/2+4,t??v,'middle','st');
const pan=(x0,pts,line)=>rc(x0,8,90,86,'sgl')+(line||'')+pts.map(p=>ci(x0+6+p[0]*78,88-p[1]*74,2.8)).join('');
const V={
'0-0':[()=>{let s=ci(80,50,44,'sgl')+ci(235,50,26,'sgl');for(let i=0;i<70;i++){const a=i*2.4,r=Math.sqrt((i+.5)/70)*41;s+=ci(80+r*Math.cos(a),50+r*Math.sin(a),2.3,i%7?'sgf':'sf')}for(let j=0;j<10;j++){const a=j*.698,r=j?15:0;s+=ci(235+r*Math.cos(a),50+r*Math.sin(a),2.6)}return s+ln(128,50,205,50,'sd')+tx(166,44,'seçmə','middle','sm')+tx(80,108,'Populyasiya (N)','middle','sm')+tx(235,88,'Nümunə (n)','middle','sm')},'Böyük dairə bütün populyasiyadır, rəngli nöqtələr ondan təsadüfi seçilmiş nümunədir. Nümunəni öyrənib nəticəni bütövə şamil edirik.'],
'0-1':[()=>{let s=tx(80,14,'Kəmiyyət','middle','sc')+tx(225,14,'Keyfiyyət','middle','sc')+ln(20,80,140,80);[162,168,171,175,178].forEach(v=>s+=ci(25+(v-160)*5.5,70,4));[160,170,180].forEach(v=>s+=tx(25+(v-160)*5.5,93,v,'middle','sm'));s+=tx(80,108,'boy (sm): orta hesablanır','middle','sm');[['qəhvəyi ×6',28],['mavi ×3',52],['yaşıl ×2',76]].forEach(a=>s+=rc(165,a[1],120,19,'sl')+tx(225,a[1]+13,a[0]));return s+tx(225,108,'göz rəngi: yalnız sayılır','middle','sm')},'Sol: ədədlə ölçülən data (ortası var). Sağ: kateqoriyalar, onları yalnız qruplaşdırıb saymaq olar.'],
'0-2':[()=>{let s=tx(75,14,'Diskret','middle','sc')+tx(220,14,'Kəsilməz','middle','sc')+ln(15,90,140,90);[.3,.7,1,.8,.5,.2].forEach((a,k)=>{const x=28+k*20;s+=ln(x,90,x,90-a*55,'sa')+ci(x,90-a*55,3.5)+tx(x,102,k,'middle','sm')});return s+ln(160,90,285,90)+cv(nrm,160,125,90,55,-3,3,'sl',true)+tx(222,108,'istənilən qiymət','middle','sm')},'Diskret: yalnız ayrı-ayrı qiymətlər (0, 1, 2…), aralarında boşluq var. Kəsilməz: aralıqda hər nöqtə mümkündür.'],
'0-3':[()=>{const n=['Nominal','Ordinal','Interval','Ratio'],c=['ad','+ sıra','+ fərq','+ nisbət'];return n.map((a,i)=>{const x=15+i*70,h=25+i*20;return rc(x,100-h,64,h,'sl')+tx(x+32,100-h+14,c[i],'middle','st')+tx(x+32,112,a,'middle','sm')}).join('')},'Hər pillədə əvvəlki imkanlara yeni əməliyyat əlavə olunur: ad → sıra → fərq → nisbət.'],
'0-4':[()=>bars([1,4,10,5],['bal 2','bal 3','bal 4','bal 5'],[3],(a)=>a+' ('+(a/20).toFixed(2)+')',{x0:20,x1:280})+tx(150,14,'Sütun üstü: tezlik (nisbi tezlik), cəm = 20 (1.00)','middle','sm'),'Sütunun hündürlüyü tezlikdir. “5” balı 5 nəfərdə var: 5/20 = 0.25. Nisbi tezliklərin cəmi 1-dir.'],
'1-0':[()=>{const sx=v=>20+v*2.6;let s=ln(20,44,280,44)+ln(20,98,280,98);[4,6,8,10,12].forEach(v=>s+=ci(sx(v),38,4));[4,6,8,10,100].forEach(v=>s+=ci(sx(v),92,4));return s+tri(sx(8),46)+tx(sx(8)+12,60,'x̄ = 8','start','sc')+tri(sx(25.6),100)+tx(sx(25.6)+12,114,'x̄ = 25.6 (100 səbəbindən)','start','sc')},'Orta ox üzərində tarazlıq nöqtəsidir. Bir kənar qiymət (100) onu datanın tipik hissəsindən çox uzağa çəkir.'],
'1-1':[()=>{const v=[3,5,7,9,100];let s=v.map((a,i)=>rc(25+i*50,30,44,34,i==2?'sh':'sl')+tx(47+i*50,52,a)).join('');return s+tx(147,84,'median = 7','middle','sc')+tx(247,84,'orta = 24.8 ✗','middle','sm')+tx(150,14,'sıralanmış data','middle','sm')+ln(147,66,147,74,'sa')},'Data sıralanır, ortadakı seçilir. 100 nə qədər böyük olsa da, median dəyişmir.'],
'1-2':[()=>bars([1,3,1,1],[2,3,5,7],[1],a=>a,{x0:40,x1:260})+tx(150,14,'moda = 3 (ən hündür sütun)','middle','sc'),'Moda ən hündür sütundur: 3 qiyməti 3 dəfə təkrarlanıb.'],
'1-3':[()=>{const sx=v=>20+v/9*260;return ln(sx(2.75),30,sx(6.25),30,'sa')+tx(sx(4.5),24,'IQR = 3.5','middle','sc')+box(sx,58,1,2.75,4.5,6.25,8)+[[1,'min 1'],[2.75,'Q1 2.75'],[4.5,'med 4.5'],[6.25,'Q3 6.25'],[8,'max 8']].map(a=>tx(sx(a[0]),88,a[1],'middle','sm')).join('')},'Boxplot: qutu Q1-dən Q3-ə qədərdir (ortadakı 50% data), qalın xətt medianı göstərir.'],

'7-2':[()=>ln(30,96,270,96)+cv(nrm,30,240,96,75,-3.5,3.5,'sh',true,1.5,3.5)+cv(nrm,30,240,96,75,-3.5,3.5,'sh',true,-3.5,-1.5)+cv(nrm,30,240,96,75,-3.5,3.5)+tx(150,108,'0','middle','sm')+tx(30+5/7*240,108,'t = 1.5','middle','sm')+tx(150,16,'p = rənglənmiş sahələrin cəmi ≈ 0.147','middle','sc')+tx(150,48,'p > 0.05 → rədd yox','middle','st'),'p-value H₀ doğru olsa, bizimki kimi və ya daha kəskin nəticənin ehtimalıdır, yəni rənglənmiş quyruq sahələridir.'],
'7-3':[()=>ln(30,96,270,96)+cv(nrm,30,240,96,75,-3.5,3.5,'sl',true,-1.96,1.96)+cv(nrm,30,240,96,75,-3.5,3.5,'sh',true,1.96,3.5)+cv(nrm,30,240,96,75,-3.5,3.5,'sh',true,-3.5,-1.96)+cv(nrm,30,240,96,75,-3.5,3.5)+tx(30+1.54/7*240,108,'−1.96','middle','sm')+tx(30+5.46/7*240,108,'+1.96','middle','sm')+tx(150,16,'ikitərəfli test: hər quyruqda 2.5%','middle','sc')+tx(150,60,'rədd etmə: 95%','middle','st'),'Tünd quyruqlar rədd sahəsidir. Statistika bu sahəyə düşərsə, H₀ rədd edilir.'],
'7-4':[()=>{let s=tx(142,14,'H₀ doğrudur','middle','sm')+tx(228,14,'H₀ səhvdir','middle','sm')+tx(94,44,'rədd edirik','end','sm')+tx(94,84,'rədd etmirik','end','sm');[['I tip xəta (α)','güc = 1−β'],['düzgün (1−α)','II tip xəta (β)']].forEach((r,i)=>r.forEach((t,j)=>{const bad=(i==0&&j==0)||(i==1&&j==1);s+=rc(100+j*86,22+i*40,82,36,bad?'sh':'sl')+tx(141+j*86,44+i*40,t,'middle','st')}));return s},'Tünd xanalar səhv qərarlardır: I tip (yalançı həyəcan) və II tip (qaçırılmış fərq).']

const X={"0-0": "Sual belədir: “nəticəni kimə aid etmək istəyirəm?” Cavab populyasiyadır. Hamısını ölçə bilmirsənsə, təsadüfi nümunə götür və nəticəni ona şamil et. Nümunə nə qədər təsadüfi və böyükdürsə, nəticə bir o qədər etibarlıdır.", "0-1": "Dəyişənin üzərində orta hesablamaq mənalıdırmı? Bəli → kəmiyyət, xeyr → keyfiyyət. Cins və şəhər keyfiyyətdir, hətta 1, 2 kimi kodlansa belə.", "0-2": "Sual: “bunu sayıram, yoxsa ölçürəm?” Sayılırsa və qiymətlər arasında boşluq varsa (1 ilə 2 arasında 1.5 yoxdur) diskretdir. Ölçülürsə və dəqiqliyi alətdən asılıdırsa kəsilməzdir.", "0-3": "Pillələri yoxla: yalnız adlar? nominal. Sıralamaq olur? ordinal. Fərqi hesablamaq mənalıdır? interval. “2 dəfə çox” demək mənalıdır? ratio. Şkala hansı statistikanı işlədə biləcəyini təyin edir.", "0-4": "1) Hər qiyməti say (tezlik). 2) Hər tezliyi n-ə böl (nisbi tezlik). 3) Yoxla: tezliklərin cəmi n, nisbi tezliklərin cəmi 1 olmalıdır.", "1-0": "1) Bütün qiymətləri topla. 2) Sayına böl. Orta datanın “tarazlıq nöqtəsi”dir: kənar qiymət balansı sürüşdürür, belə hallarda medianı da yoxla.", "1-1": "1) Qiymətləri kiçikdən böyüyə sırala. 2) n təkdirsə ortadakını, cütdürsə ortadakı ikisinin ortasını götür. Datanın yarısı medianın altında, yarısı üstündədir.", "1-2": "Hər qiymətin neçə dəfə təkrarlandığını say və ən çox təkrarlananı seç. Heç biri təkrarlanmırsa moda yoxdur; iki qiymət bərabər təkrarlanırsa iki moda var.", "1-3": "1) Sırala. 2) Median datanı iki yarıya bölür. 3) Alt yarının medianı Q1, üst yarının medianı Q3. 4) IQR = Q3 − Q1. Excel kvartili interpolyasiya ilə tapdığı üçün əl hesabından az fərqlənə bilər.", "1-4": "1) IQR-ı tap. 2) Aşağı sərhəd = Q1 − 1.5·IQR, yuxarı sərhəd = Q3 + 1.5·IQR. 3) Sərhəddən kənardakı qiymət outlier-dir. Outlier avtomatik səhv deyil: əvvəl səbəbini yoxla, sonra qərar ver.", "1-5": "max − min. Yalnız iki qiymətdən asılı olduğu üçün tək kənar qiymət aralığı şişirdir; ona görə IQR və ya s ilə birlikdə baxılır.", "1-6": "1) x̄-ı tap. 2) Hər qiymətdən x̄-ı çıx. 3) Fərqləri kvadrata yüksəlt (mənfi və müsbət bir-birini silməsin). 4) Topla. 5) n−1-ə böl. n−1 nümunənin variansı az qiymətləndirməsini düzəldir.", "1-7": "Varians kvadrat vahiddədir (bal²), onu başa düşmək çətindir. Kök alanda vahid yenə “bal” olur. Normal datada qiymətlərin təxminən 68%-i x̄ ± s, 95%-i x̄ ± 2s aralığındadır.", "1-8": "1) s-i x̄-a böl. 2) 100-ə vur. Kq ilə qram kimi fərqli vahidli dəyişənlərin hansının nisbətən daha çox dəyişdiyini görməyə imkan verir. Ortası 0-a yaxın olan datada işləmir.", "2-0": "1) Bütün mümkün halları yaz. 2) Hadisəyə uyğun halları say. 3) Böl. Yalnız halların hamısı bərabər ehtimallı olanda işləyir (adil zər, adil sikkə).", "2-1": "“Ən azı bir” sözünü görəndə əks hadisəni düşün: “heç biri”. Onun ehtimalını tap və 1-dən çıx. Birbaşa saymaqdan çox asandır.", "2-2": "Sual: bu iki hadisə eyni anda ola bilərmi? Xeyr → “və ya” üçün ehtimalları topla. Bəli → növbəti qaydadan (ümumi cəm) istifadə et.", "2-3": "1) P(A) və P(B)-ni topla. 2) Hər ikisində olan halları (A∩B) bir dəfə çıx, çünki iki dəfə sayılıb. “A və ya B” = ya A, ya B, ya da hər ikisi.", "2-4": "Sual: biri baş verdi, digərinin şansı dəyişdimi? Dəyişmədisə hadisələr müstəqildir və “və” üçün ehtimalları vurursan. Yadda saxla: vurma “və”, toplama “və ya” deməkdir.", "2-5": "1) B-nin baş verdiyini qəbul et: yeni dünya yalnız B-dir. 2) Bu yeni dünyada A-ya uyğun halları say. Düstur eyni işi görür: P(A∩B)/P(B).", "2-6": "1000 nəfərlə düşün: 10 xəstə → 9.5 müsbət test; 990 sağlam → 49.5 yanlış müsbət. Müsbətlər cəmi 59-dur, onlardan yalnız 9.5-i xəstədir: 9.5/59 ≈ 16%. Nadir hadisədə yanlış müsbətlər çox olur.", "3-0": "PMF: “dəqiq x gəlir” ehtimalı. CDF: “x və ya ondan kiçik gəlir” ehtimalı, yəni PMF-in yığılmış cəmi. CDF həmişə artır və 1-də bitir.", "3-1": "Hər qiyməti öz ehtimalına vur və hamısını topla. Bu, uzun müddətdə orta nəticədir, tək atışda mütləq gələn qiymət deyil.", "3-2": "1) E(X) tap. 2) E(X²) tap (hər qiymətin kvadratını ehtimalına vur, topla). 3) Fərqini al. Böyük varians nəticələrin daha çox yayıldığını göstərir.", "3-3": "Paylanmaya 4 sual ver: mərkəzi hardadır (orta)? nə qədər yayılıb (varians)? hansı tərəfə əyilib (əyrilik)? quyruqları nə qədər qalındır (ekssess)? Maaş datasında sağ quyruq uzundur, ona görə orta medianından böyükdür.", "3-4": "Üç şərt: sınaqların sayı sabitdir, hər sınaq iki nəticəlidir (uğur/uğursuz), uğur ehtimalı eynidir və sınaqlar müstəqildir. C(n,k) k uğurun neçə müxtəlif sırada düzülə biləcəyini sayır.", "3-5": "Hadisələr müstəqil və təsadüfi baş verirsə və orta sürəti (λ) bilirsənsə, Poisson işlədilir (zənglər, nasazlıqlar, müştərilər). Poissonda orta və varians hər ikisi λ-ya bərabərdir.", "3-6": "Bütün qiymətlərin şansı eynidir, ona görə qrafik düzbucaqlıdır. Ehtimal = sahə = en × hündürlük. Aralıq nə qədər genişdirsə, ehtimal o qədər böyükdür.", "3-7": "1) Z = (X − μ)/σ hesabla: ortadan neçə σ uzaqdır? 2) Z-dən solda qalan sahəni tap (Z cədvəli və ya NORM.S.DIST). Qayda: ±1σ → 68%, ±2σ → 95%, ±3σ → 99.7%.", "4-0": "Cədvəl iki dəyişənin hər birləşməsinin ehtimalını verir. Yoxlama: bütün xanaların cəmi 1 olmalıdır. Xananı belə oxu: “X = 1 və eyni zamanda Y = 1”.", "4-1": "Birinə baxıb digərini “unutmaq” üçün sətir və ya sütunu topla. Nəticə cədvəlin kənarında (marjada) yazıldığı üçün marjinal adlanır.", "4-2": "1) x̄ və ȳ tap. 2) Hər nöqtə üçün (x−x̄)(y−ȳ) hesabla. 3) Topla, n−1-ə böl. Hər ikisi ortadan yuxarı və ya hər ikisi aşağıdırsa hasil müsbət, biri yuxarı biri aşağıdırsa mənfi olur.", "4-3": "Kovarians miqyasdan asılıdır (sm ilə metr fərqli ədəd verir). s-lərə bölünəndə vahid yox olur və r həmişə −1…+1 arasında qalır. Təxmini qayda: |r| > 0.7 güclü, < 0.3 zəif sayılır.", "4-4": "Cədvəldə X-in məlum qiymətini seç, o sətirdəki xanaları sətir cəminə böl. Alınan ehtimalların cəmi yenə 1 olur, çünki yeni “kiçik dünya” yaranıb.", "4-5": "Əvvəlcə şərti paylanmanı tap, sonra adi gözlənilən dəyər kimi hesabla: hər y-i öz şərti ehtimalına vur və topla. X dəyişdikcə bu ədəd dəyişir; bu asılılıq reqressiya xəttinin ideyasıdır.", "5-0": "Reqressiya xətti nöqtələrə ən yaxın düz xəttdir (qalıqların kvadratlar cəmi ən kiçik). İstənilən x üçün xətt üzərindəki y proqnozdur. Yalnız data aralığı daxilində proqnoz etibarlıdır.", "5-1": "1) Cov(x,y) hesabla. 2) Var(x)-ə böl. İşarə istiqaməti, böyüklük sürəti göstərir. Vahidə diqqət et: “x-in hər 1 vahidi üçün y-də orta dəyişmə”.", "5-2": "β₁-i tap, sonra xəttin (x̄, ȳ)-dan keçdiyini bilərək β₀ = ȳ − β₁·x̄ yaz. x = 0 mənasızdırsa (məs., boy = 0), β₀ yalnız riyazi hissədir.", "5-3": "Qalıq = real − proqnoz. Müsbətdirsə, model az proqnozlaşdırıb; mənfidirsə, çox. Qalıqların cəmi 0-dır; modelin keyfiyyətini onların böyüklüyü göstərir.", "5-4": "1) SST = Σ(y − ȳ)². 2) SSE = Σ(y − ŷ)². 3) R² = 1 − SSE/SST. R² = 1 mükəmməl uyğunluqdur, 0 isə modelin sadəcə ortadan yaxşı olmadığı deməkdir. Yüksək R² səbəbiyyət sübut etmir.", "5-5": "Qalıqları x (və ya ŷ) üzərində çək. Gözlənilən şəkil: 0 xətti ətrafında nizamsız zolaq. Əyri → xətti model uyğun deyil; qıfıl → varians sabit deyil; kənarda tək nöqtə → outlier."};
const N={"0-0": "Bank tələbələr üçün kart təklifi hazırlayır və Bakıdakı 60 000 tələbənin orta aylıq xərcini bilmək istəyir. Hamını sorğulamaq mümkün deyil, ona görə müxtəlif universitetlərdən 300 tələbə təsadüfi seçilir (nümunə). Orta xərc 420 AZN çıxır və bank bunu bütün 60 000 tələbəyə aid edir. Yalnız bir bahalı universitetdən sorğu keçirsəydi, nəticə yanıldıcı olardı: nümunə populyasiyanı təmsil etməlidir.", "0-1": "Yeməkçatdırma tətbiqi kuryer məlumatı toplayır: boy 172 sm, aylıq qazanc 900 AZN, rayon Nəsimi, nəqliyyat velosiped. Boy və qazanc kəmiyyətdir: 10 kuryerin orta qazancını tapa bilərik. Rayon və nəqliyyat keyfiyyətdir: “10 kuryerdən 6-sı velosipedlə işləyir” deyə bilərik, “orta nəqliyyat” deyə bilmərik.", "0-2": "Marketdə kassa növbəsində 28 nəfər dayanıb: 28.5 nəfər ola bilməz, sayırıq → diskret. Aldığın almanın çəkisi 1.37 kq də ola bilər, tərəzi 1.372 də göstərə bilər, ölçürük → kəsilməz. Sadə qayda: “say” → diskret, “ölç” → kəsilməz. Bu seçim sonra hansı paylanmanı işlədəcəyini təyin edir (diskret üçün Binomial/Poisson, kəsilməz üçün Normal).", "0-3": "Mobil operatorun müştəri cədvəlində: 1) Tarif adı (Standart, Plus, Premium) → nominal: yalnız ad. 2) “Xidmətdən razılıq: aşağı/orta/yüksək” → ordinal: sıra var, amma fərq ölçülmür. 3) Bakıda hava 20°C və 40°C → interval: fərq mənalıdır, amma 40°C “2 dəfə isti” deyil, çünki 0°C real sıfır deyil. 4) Aylıq internet 20 GB və 40 GB → ratio: 40 GB həqiqətən 2 dəfə çoxdur.", "0-4": "Müəllim 20 şagirdin imtahan nəticəsini yazır: 2 bal → 1 şagird, 3 bal → 4, 4 bal → 10, 5 bal → 5. Tezliklər: 1, 4, 10, 5 (cəmi 20). Nisbi tezliklər: 0.05, 0.20, 0.50, 0.25 (cəmi 1.00). Valideyn yığıncağında deyir: “sinfin yarısı 4 alıb, 25%-i əla (5) alıb”. Cəmin 20 və 1.00 çıxması hesablamanın düzgünlüyünü yoxlayır.", "1-0": "Kiçik ofisdə 5 işçinin aylıq maaşı (yüz AZN): 4, 6, 8, 10, 12. Orta = 40/5 = 8, yəni 800 AZN. İndi ofisə 10 000 AZN alan rəhbər (100) əlavə olunub: 4, 6, 8, 10, 100 → orta 25.6. “Orta maaş 2560 AZN” elanı yazsan, dörd işçi 1000 AZN-dən az alır. Nəticə: kənar qiymət olanda orta aldadıcıdır, medianı da yoxla.", "1-1": "Rayonda 5 evin qiyməti (min AZN): 3, 5, 7, 9, 100 (sonuncu villadır). Sıralıdır, ortadakı 3-cü qiymət = 7, yəni median 70 000 AZN. Orta isə 24.8 yəni 248 000 AZN olardı, rayondakı heç bir adi ev o qədər deyil. Buna görə emlak saytları “median qiymət” göstərir. Cüt hal: 2, 4, 6, 8 → (4+6)/2 = 5.", "1-2": "Ayaqqabı mağazası bir gündə satdığı ölçüləri yazır: 40, 41, 41, 42, 41, 43, 42. Sayırıq: 40 → 1, 41 → 3, 42 → 2, 43 → 1. Moda = 41. Sahibkar növbəti sifarişdə ən çox 41 ölçüsündən alır. Eyni məntiq “ən çox satılan rəng” və ya “ən çox seçilən tarif” üçün də işləyir.", "1-3": "Kafenin 8 günlük satışı (yüz AZN): 1, 2, 3, 4, 5, 6, 7, 8. Median = (4+5)/2 = 4.5. Q1-in mövqeyi 1 + 0.25·7 = 2.75-ci yerdir → 2 + 0.75·(3−2) = 2.75. Q3-ün mövqeyi 1 + 0.75·7 = 6.25 → 6 + 0.25·(7−6) = 6.25. IQR = 6.25 − 2.75 = 3.5. Oxunuş: günlərin ortadakı yarısında satış 275–625 AZN arasındadır; bu, “adi gün”dür.", "1-4": "Eyni kafe: Q1 = 2.75, Q3 = 6.25, IQR = 3.5 → sərhədlər −2.5 və 11.5. Bir gün kafe toya xidmət etdi və satış 20 (2000 AZN) oldu. 20 > 11.5 → outlier. Bu səhv deyil, real toy sifarişidir: onu silmə, amma “adi gün” ortalamasını hesablayanda ayrıca saxla. Əgər 20 klaviatura səhvidirsə (2.0 yazılmalı idi), düzəldərsən.", "1-5": "Beş şagirdin balı: 4, 6, 8, 10, 12 → R = 12 − 4 = 8. Direktor deyir: “bal fərqi 8-dir”. Sinfə 100 alan olimpiada qalibi gəlsə, R = 96 olur, halbuki dörd şagird yenə 4–10 arasındadır. Aralıq yalnız iki ucdakı şagirdə baxır; ona görə tək onunla kifayətlənmə.", "1-6": "Taksi sürücüsü üç gün ərzində qazanır (yüz AZN): 2, 4, 6. 1) x̄ = 4. 2) Kənarlaşmalar: −2, 0, +2. 3) Kvadratlar: 4, 0, 4. 4) Cəm = 8. 5) s² = 8/(3−1) = 4. Başqa sürücü 4, 4, 4 qazansa, s² = 0 olar: gəliri tam stabildir. Kvadrat alırıq, çünki kənarlaşmaların cəmi həmişə 0-dır.", "1-7": "Eyni sürücü: s² = 4 → s = 2, yəni gündəlik gəlir ortadan (400 AZN) orta hesabla 200 AZN uzaqdır. İkinci sürücü: 3, 4, 5 → s = 1 (stabil). Üçüncü: 0, 4, 8 → s = 4 (bir gün heç nə, bir gün çox). Üçünün ortası eynidir, amma risk və qeyri-müəyyənliyi yalnız s göstərir.", "1-8": "Zavodda avtomobil (orta 1500 kq, s = 50) və alma (orta 150 q, s = 20) çəkilir. Hansı daha qeyri-sabitdir? 50 > 20 görünür, amma vahidlər fərqlidir (kq və q). CV: avtomobil 50/1500·100 = 3.3%, alma 20/150·100 = 13.3%. Alma partiyasında çəki nisbətən 4 dəfə çox dəyişir, ona görə keyfiyyət nəzarəti orada daha vacibdir.", "2-0": "Mağaza lotereyasında 10 bilet var, 3-ü hədiyyə qazanır. Təsadüfi birini çəkirsən: P = 3/10 = 0.3. Nərd zəri ilə: cüt gəlmə üçün hallar 1…6 (6 hal), əlverişli 2, 4, 6 (3 hal) → 3/6 = 0.5. Qayda: əlverişli halların sayı ÷ bütün halların sayı, halların şansı bərabər olanda.", "2-1": "Üç dost kafedə hesabı sikkə atıb bölür: gerb gətirən ödəyir. “Ən azı bir nəfər ödəyir” (ən azı bir gerb) ehtimalı? 1, 2 və ya 3 gerb hallarını saymaq uzundur. Əksinə: heç kim ödəmir, yəni 3 yazı = 1/2·1/2·1/2 = 1/8. Cavab 1 − 1/8 = 7/8 = 87.5%.", "2-2": "Taksi dispetçeri 6 sürücüdən birini təsadüfi göndərir. 1 və 2 nömrəli sürücülərin maşını Skoda-dır. Eyni sürücü həm 1, həm 2 nömrəli ola bilməz → hadisələr qarşılıqlı istisnadır. P(Skoda) = 1/6 + 1/6 = 2/6 = 1/3. Yoxlama: 6 sürücüdən 2-si əlverişlidir.", "2-3": "6 tələbə nömrələnib. A = kursa yazılanlar {2, 4, 6}, B = təqaüd alanlar {4, 5, 6}. “Kursa yazılıb və ya təqaüd alır” ehtimalı? P(A) = 3/6, P(B) = 3/6, hər ikisində {4, 6} → 2/6. Sadəcə toplasaq, 4 və 6 iki dəfə sayılar. Düzgün: 3/6 + 3/6 − 2/6 = 4/6 = 2/3. Yoxlama: {2, 4, 5, 6} → 4 nəfər.", "2-4": "Kuryer iki ayrı ünvana çatdırır. Hər ünvanda müştərinin evdə olma şansı 1/2-dir və biri digərindən asılı deyil. İkisində də evdə olma: 1/2 · 1/2 = 1/4. Cədvəldə 4 bərabər hal var (ev-ev, ev-yox, yox-ev, yox-yox), əlverişli yalnız 1-dir. Üç ünvan üçün 1/2·1/2·1/2 = 1/8: “və” üçün ehtimallar vurulur.", "2-5": "Sığorta şirkəti 6 qəza yoxlayır: 3-ü gecə baş verib (B) və onlardan 1-i sərxoşluqla bağlıdır (A). Qəzanın gecə olduğu məlumdursa, sərxoşluq ehtimalı? Yeni “kiçik dünya” yalnız 3 gecə qəzasıdır, onlardan 1-i sərxoşluqludur → 1/3. Düsturla: P(A∩B) = 1/6, P(B) = 3/6 → (1/6)/(3/6) = 1/3. Gecə olduğunu bilməsək, ehtimal 1/6 idi.", "2-6": "Poliklinikada 1000 nəfər yoxlanır. Nadir xəstəlik 1%-dir: 10 nəfər xəstə, 990 nəfər sağlam. Test xəstədə 95% müsbət verir → 9.5 nəfər. Sağlam 990-dan 5%-nə yanlış müsbət verir → 49.5 nəfər. Cəmi müsbət ≈ 59, onlardan yalnız 9.5-i həqiqətən xəstədir: 9.5/59 ≈ 16%. Düsturla da P(xəstə|müsbət) = 0.0095/0.059 ≈ 0.16. Buna görə həkim müsbət testdən sonra panika etmir, təkrar yoxlama təyin edir.", "3-0": "Nərd oynayırsan və zər atırsan (X = düşən ədəd). “Dəqiq 3 gəlsin” → PMF: P(X=3) = 1/6. “Ən çoxu 3 gəlsin” (kiçik gediş) → CDF: F(3) = 1/6 + 1/6 + 1/6 = 3/6 = 0.5. Başqa: F(5) = 5/6, F(6) = 1. Sualda “və ya daha az” sözünü görəndə CDF-dən istifadə et.", "3-1": "Nərddə hər atışda zərin ədədi qədər xana gedirsən. E(X) = (1+2+3+4+5+6)/6 = 3.5. Heç bir atışda 3.5 gəlmir, amma 100 atışda cəmi təxminən 100 · 3.5 = 350 xana gedirsən. Gözlənilən dəyər tək atışın nəticəsi deyil, uzun müddətli ortadır.", "3-2": "Nərdçi A adi zər atır: E(X) = 3.5, E(X²) = 91/6 ≈ 15.17, Var = 15.17 − 12.25 = 2.92. Nərdçi B-nin “yüklənmiş” zəri həmişə 3 və ya 4 gətirir (hər biri 1/2): E(X) = 3.5, E(X²) = (9+16)/2 = 12.5, Var = 12.5 − 12.25 = 0.25. Orta atış eynidir, amma A-nın nəticəsi proqnozlaşmazdır, B-nin sabitdir. Varians riskin ölçüsüdür.", "3-3": "Statistika idarəsi bir şirkətin maaşlarına baxır: işçilərin çoxu 800–1200 AZN alır, iki direktor isə 8000 AZN. 1) Orta ≈ 1500 (direktorlar yuxarı çəkir). 2) Varians böyükdür. 3) Əyrilik müsbətdir: quyruq sağa uzanır. 4) Ekssess yüksəkdir: ifrat qiymətlər var. Median ≈ 1000 tipik işçinin maaşını daha düzgün göstərir.", "3-4": "Toya 10 nəfəri dəvət etmisən və hər biri 50% şansla gəlir (bir-birindən asılı olmayaraq). Tam 3 nəfərin gəlməsi ehtimalı? C(10,3) = 10·9·8/(3·2·1) = 120 müxtəlif birləşmə. Hər birinin ehtimalı 0.5³·0.5⁷ = 1/1024. P = 120/1024 ≈ 0.117, yəni təxminən 12%. Ən ehtimallı say 5-dir.", "3-5": "Bank zəng mərkəzinə saatda orta 4 zəng gəlir (λ = 4). Tam 2 zəng gəlməsi: 1) 4² = 16. 2) e⁻⁴ ≈ 0.0183. 3) 2! = 2. P = 16·0.0183/2 ≈ 0.147. Heç zəng gəlməsi P(0) = e⁻⁴ ≈ 0.018, yəni saatların təxminən 2%-i səssiz keçir. Bu hesablama operatorların sayını planlamaq üçün işlədilir.", "3-6": "Avtobus hər 10 dəqiqədən bir gəlir, sən stansiyaya təsadüfi anda çatırsan: gözləmə X ~ Uniform(0; 10). Hündürlük 1/10 = 0.1. P(3 dəqiqədən az gözləmə) = 3·0.1 = 0.3. P(5 dəqiqədən çox) = 5·0.1 = 0.5. Orta gözləmə (0+10)/2 = 5 dəqiqə. Cədvəli bilməyənlər üçün: orta hesabla yarım interval gözləyirsən.", "3-7": "Qəbul imtahanında bal normal paylanıb: μ = 70, σ = 10. Tələbə 85 alıb. Z = (85−70)/10 = 1.5: orta nəticədən 1.5σ yuxarıdır. NORM.S.DIST(1.5;TRUE) ≈ 0.933 → iştirakçıların 93.3%-i ondan aşağı bal alıb. 60 bal alan üçün Z = −1 → təxminən 16% ondan aşağıdır. Beləliklə bal reytinq məqsədləri üçün yerə çevrilir.", "4-0": "Onlayn kurs platforması 1000 tələbəni izləyir. X = əlavə mentor dərslərinə yazılıb (0/1), Y = imtahandan keçib (0/1). Cədvəl: P(0,0) = 0.3 (300 nəfər), P(0,1) = 0.2 (200), P(1,0) = 0.1 (100), P(1,1) = 0.4 (400). Oxu: “yazılıb və keçib” 40%-dir. Yoxlama: 0.3 + 0.2 + 0.1 + 0.4 = 1.", "4-1": "Eyni platforma. Yazılmayanlar (X=0): 300 + 200 = 500 nəfər → P(X=0) = 0.5. Yazılanlar: 100 + 400 = 500 → P(X=1) = 0.5. Keçənlər (Y=1): 200 + 400 = 600 → P(Y=1) = 0.6. Rəhbər “tələbələrin neçə faizi keçib?” soruşanda cavab marjinal ehtimaldır: 60%.", "4-2": "Leyla, Nigar və Əli imtahandan əvvəl müvafiq olaraq 1, 2, 3 saat oxuyub və 50, 60, 70 bal alıb. x̄ = 2, ȳ = 60. Hasillər: (1−2)(50−60) = 10, (2−2)(60−60) = 0, (3−2)(70−60) = 10. Cəm = 20 → Cov = 20/(3−1) = 10. Müsbət: çox oxuyan daha çox bal alıb.", "4-3": "Eyni üç tələbə: Cov = 10, sₓ = 1, s_y = 10 → r = 10/(1·10) = 1, mükəmməl müsbət xətti əlaqə. Əks halda (50, 60, 70 əvəzinə 70, 60, 50) r = −1 olardı. Diqqət: dondurma satışı ilə suda boğulma yayda birgə artır (r müsbət), amma əsl səbəb isti havadır, dondurma deyil.", "4-4": "Platformada yazılmayan 500 nəfərdən 200-ü keçib: P(Y=1|X=0) = 0.2/0.5 = 0.4, keçməyən 0.3/0.5 = 0.6. Yazılan 500 nəfərdən 400-ü keçib: P(Y=1|X=1) = 0.4/0.5 = 0.8. Nəticə: yazılanların keçmə ehtimalı 80%, yazılmayanların 40%-dir. Şərti ehtimal iki qrupu ayrıca müqayisə edir.", "4-5": "Eyni platforma: E(Y|X=0) = 0·0.6 + 1·0.4 = 0.4, E(Y|X=1) = 0·0.2 + 1·0.8 = 0.8. Oxunuş: yazılmayanların 40%-i, yazılanların 80%-i keçir. X dəyişdikcə gözlənti 0.4-dən 0.8-ə qalxır, bu da X ilə Y arasında asılılığı göstərir. Reqressiya məhz bu fikrə əsaslanır.", "5-0": "Repetitor statistikaya əsasən model qurur: ŷ = 40 + 10x (x = oxuma saatı, ŷ = proqnoz bal). 4 saat oxuyan tələbə: ŷ = 40 + 10·4 = 80. 2 saat: 60. 0 saat: 40. Xəbərdarlıq: 20 saat üçün 240 bal proqnozu mənasızdır, çünki model yalnız 1–3 saat aralığındakı datadan qurulub.", "5-1": "x = 1, 2, 3 saat; y = 50, 60, 70 bal. Cov(x,y) = 10, Var(x) = 1 → β₁ = 10/1 = 10. Repetitor tələbəyə deyir: “hər əlavə oxuma saatı orta hesabla +10 bal gətirir”. 2 saatdan 3 saata keçəndə proqnoz 60-dan 70-ə qalxır.", "5-2": "x̄ = 2, ȳ = 60, β₁ = 10. β₀ = 60 − 10·2 = 40 → ŷ = 40 + 10x. Yoxlama: x = 2 üçün ŷ = 40 + 20 = 60 = ȳ, yəni xətt (x̄, ȳ)-dan keçir. Heç oxumayan tələbə üçün proqnoz 40 baldır (bu, “baza bilik” səviyyəsidir).", "5-3": "Model ŷ = 40 + 10x. Nigar 3 saat oxuyub və 75 bal alıb. Proqnoz = 70. Qalıq e = 75 − 70 = +5: model onu 5 bal az qiymətləndirib (bəxti gətirib və ya yaxşı hazırlaşıb). Əli 2 saat oxuyub və 55 alıb: proqnoz 60, e = 55 − 60 = −5, model çox qiymətləndirib.", "5-4": "Repetitor 20 tələbənin datasına baxır. Ballardakı ümumi dəyişkənlik SST = 100, modeldən sonra qalan səhv SSE = 36. R² = 1 − 36/100 = 0.64. Oxunuş: tələbələr arasındakı bal fərqlərinin 64%-i oxuma saatı ilə izah olunur, qalan 36%-i yuxu, əvvəlki bilik, stress və başqa amillərdəndir.", "5-5": "Repetitor qalıq qrafikinə baxır. 1) Nöqtələr 0 xətti ətrafında nizamsız səpələnibsə, model yaxşıdır. 2) “U” forması: çox oxumaq bir yerdən sonra bal artırmır, asılılıq əyridir, xətti model uyğun deyil. 3) Qıfıl forması: oxuma saatı artdıqca bal fərqləri böyüyür (güclülər çox, zəiflər az), varians sabit deyil. Çarə: başqa model və ya transformasiya."};

function ctr(){sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2}
document.getElementById('zi').onclick=()=>{z=Math.min(2,z+.15);ap()};
document.getElementById('zo').onclick=()=>{z=Math.max(.3,z-.15);ap()};
document.getElementById('zf').onclick=()=>{z=Math.max(.3,(sc.clientWidth-2)/W);ap();ctr()};
m.onclick=e=>{const g=e.target.closest('[data-k]');if(!g)return;const [i,j]=g.dataset.k.split('-'),c=document.getElementById('c'+i+'-'+j);document.getElementById('d'+i).open=true;c.scrollIntoView({behavior:'smooth',block:'center'});c.style.outline='2px solid '+T[i].c;setTimeout(()=>c.style.outline='',2500)};

(function(){
const dm=document.getElementById('dm');let busy=false;
const cur=document.createElement('div');cur.id='dcur';
cur.innerHTML='<svg viewBox="0 0 24 24" width="32" height="32"><path d="M3 2l7 19 3-8 8-3z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const rip=document.createElement('div');rip.id='drip';
document.body.appendChild(cur);document.body.appendChild(rip);
const ease=t=>t*t*(3-2*t),wait=ms=>new Promise(r=>setTimeout(r,ms));
const anim=(d,fn)=>new Promise(r=>{const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/d);fn(p);p<1?requestAnimationFrame(f):r()})(t0)});
dm.onclick=async()=>{
 if(busy)return;busy=true;dm.disabled=true;
 try{
  document.getElementById('zf').click();
  sc.scrollIntoView({block:'center'});
  await wait(150);
  const gs=[...m.querySelectorAll('.lf')],g=gs[Math.floor(Math.random()*gs.length)];
  const r=g.querySelector('text').getBoundingClientRect(),b=sc.getBoundingClientRect();
  const x1=r.left+r.width/2,y1=r.top+r.height/2+4,x0=b.left+b.width/2,y0=b.top+b.height*0.85;
  cur.style.opacity=1;
  await anim(1300,p=>{const t=ease(p),arc=Math.sin(t*Math.PI)*40;cur.style.transform=`translate(${x0+(x1-x0)*t-6}px,${y0+(y1-y0)*t-arc-3}px)`});
  const t=g.querySelector('text'),bb=t.getBBox(),i=+g.dataset.k.split('-')[0];
  const pill=document.createElementNS('http://www.w3.org/2000/svg','rect');
  pill.setAttribute('x',bb.x-8);pill.setAttribute('y',bb.y-3);pill.setAttribute('width',bb.width+16);pill.setAttribute('height',bb.height+6);pill.setAttribute('rx',8);pill.setAttribute('fill',T[i].c);
  g.insertBefore(pill,t);g.classList.add('hl');
  await wait(600);
  rip.style.left=x1+'px';rip.style.top=y1+'px';
  await anim(350,p=>{rip.style.opacity=1-p;rip.style.transform=`scale(${1+p*3})`});
  cur.style.opacity=0;
  g.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  await wait(900);
  pill.remove();g.classList.remove('hl');
 }finally{cur.style.opacity=0;busy=false;dm.disabled=false}
};
})();
ap();ctr();
</script>
